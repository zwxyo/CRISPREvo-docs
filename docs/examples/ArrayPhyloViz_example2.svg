<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="772" height="82"
     viewBox="0 0 772 82" version="1.1" role="img">
  <title>ArrayPhyloViz export toolbar</title>
  <desc>Editable vector reproduction of the ArrayPhyloViz export buttons shown in the supplied screenshot.</desc>

  <rect width="772" height="82" fill="#ffffff"/>
  <!-- Visible button bounds are x=45..759 in the reference.  Center the
       714 px toolbar in the 772 px canvas: 29 px of space on each side. -->
  <g id="export-toolbar" transform="translate(-16 0)" font-family="Arial, Helvetica, sans-serif" font-size="16">

    <g id="save-private-link">
      <rect x="45.5" y="20.5" width="155" height="48" rx="6"
            fill="#ffffff" stroke="#d2dfe7" stroke-width="1"/>
      <text x="58" y="51" fill="#344c61">Save private link</text>
    </g>

    <g id="save-project">
      <rect x="209.5" y="20.5" width="123" height="48" rx="6"
            fill="#ffffff" stroke="#d2dfe7" stroke-width="1"/>
      <text x="222" y="51" fill="#344c61">Save project</text>
    </g>

    <g id="export-newick">
      <rect x="341.5" y="20.5" width="83" height="48" rx="6"
            fill="#ffffff" stroke="#d2dfe7" stroke-width="1"/>
      <text x="354" y="51" fill="#344c61">Newick</text>
    </g>

    <g id="export-svg">
      <rect x="433" y="20" width="60" height="49" rx="6" fill="#00998e"/>
      <text x="463" y="51" fill="#ffffff" text-anchor="middle" font-weight="700">SVG</text>
    </g>

    <g id="png-scale">
      <rect x="500.5" y="20.5" width="121" height="48" rx="6"
            fill="#ffffff" stroke="#d2dfe7" stroke-width="1"/>
      <text x="519" y="52" font-size="17" fill="#203e50">PNG 2×</text>
      <path d="M606 42 L611 47 L616 42" fill="none"
            stroke="#203e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="export-png">
      <rect x="630" y="20" width="62" height="49" rx="6" fill="#00998e"/>
      <text x="661" y="51" fill="#ffffff" text-anchor="middle" font-weight="700">PNG</text>
    </g>

    <g id="export-pdf">
      <rect x="700" y="20" width="59" height="49" rx="6" fill="#00998e"/>
      <text x="729.5" y="51" fill="#ffffff" text-anchor="middle" font-weight="700">PDF</text>
    </g>
  </g>
</svg>
