site_name: CRISPREvo Documentation
site_description: User guide for the CRISPREvo CRISPR evolutionary analysis web platform
site_author: Wenxin Zhao

repo_url: https://github.com/zwxyo/CRISPREvo-docs
repo_name: zwxyo/CRISPREvo-docs
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Wenxin Zhao

theme:
  name: material
  language: en
  logo: assets/images/CRISPREvo.svg
  favicon: assets/images/CRISPREvo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - Quick start: quickstart.md
      - End-to-end workflow: workflow.md
      - My Jobs and result recovery: my-jobs.md
  - Tool guides:
      - SeqFetcher: tools/ncbi-sequence-fetcher.md
      - CRISPRPrep: tools/crispr-processing.md
      - CRISPRPhylo: tools/crisprphylo.md
      - SpacerMap: tools/spacermap.md
      - ArrayPhyloViz: tools/figure-composer.md
      - SpacerTarget: tools/spacer-target.md
  - Reference:
      - Input formats: reference/input-formats.md
      - Downloads: reference/downloads.md
      - Limits: reference/limits.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - Citation & attribution: citation.md
  - Maintainers:
      - Read the Docs deployment: maintainers/read-the-docs.md
      - Documentation checklist: maintainers/checklist.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zwxyo/crisprevo
      name: CRISPREvo source code
